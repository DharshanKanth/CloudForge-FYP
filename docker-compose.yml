services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudforge-db
    environment:
      POSTGRES_DB: cloudforge
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: cloudforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudforge-api
    # Live reload for local development; the image default is the production
    # command without --reload.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudforge:cloudforge@postgres:5432/cloudforge
      SECRET_KEY: cloudforge-dev-secret-change-in-production
      # Seed the demo account + project on startup (idempotent). Set to "false"
      # for a clean database.
      CLOUDFORGE_SEED_DEMO: "true"
      # AWS credentials for terraform plan/apply/destroy.
      # Values come from a local .env file (git-ignored). See .env.example.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # RDS creation takes 10-15 min; give terraform enough headroom.
      CLOUDFORGE_TERRAFORM_TIMEOUT: "1800"
    volumes:
      - ./backend:/app
      # Persist Terraform workspaces (state, plans) across container rebuilds
      # so the live-infrastructure tracker keeps working after restarts.
      - ./deployments:/tmp/cloudforge-deployments
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudforge-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Isolated Terraform worker: claims queued deployments and runs them, so
  # Terraform never executes inside the API process. Shares the backend image,
  # source mount, and deployment workspace with the API.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudforge-worker
    command: ["python", "-m", "app.worker"]
    # Background worker: it serves no HTTP, so the image's HTTP healthcheck
    # does not apply.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudforge:cloudforge@postgres:5432/cloudforge
      SECRET_KEY: cloudforge-dev-secret-change-in-production
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      CLOUDFORGE_TERRAFORM_TIMEOUT: "1800"
    volumes:
      - ./backend:/app
      - ./deployments:/tmp/cloudforge-deployments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
